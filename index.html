<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Step Challenge Leaderboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="max-w-5xl mx-auto px-4 py-8">

    <!-- Header -->
    <header class="text-center mb-8">
      <span
        class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-semibold rounded-full uppercase tracking-wider mb-2">StepUp
        Challenge</span>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">🏆 Corporate Step Leaderboard</h1>
      <p class="text-slate-500 mt-2 text-sm sm:text-base">Rankings updated daily. Keep stepping towards the top!</p>
    </header>

    <!-- Upload & Search Bar -->
    <div
      class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="w-full md:w-auto flex items-center gap-3">
        <label for="csvFileInput"
          class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold px-4 py-2 rounded-lg shadow-sm transition">
          Upload Today's CSV
        </label>
        <input id="csvFileInput" type="file" accept=".csv" class="hidden" />
        <span id="fileNameDisplay" class="text-xs text-slate-400 truncate max-w-[200px]">Loaded: report.csv</span>
      </div>

      <div class="w-full md:w-72">
        <input id="searchInput" type="text" placeholder="Search participant..."
          class="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
    </div>

    <!-- Summary Metrics -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 text-center">
        <span class="text-xs font-medium text-slate-400 uppercase">Participants</span>
        <div id="statParticipants" class="text-2xl font-bold text-slate-800 mt-1">-</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 text-center">
        <span class="text-xs font-medium text-slate-400 uppercase">Total Steps Walked</span>
        <div id="statTotalSteps" class="text-2xl font-bold text-indigo-600 mt-1">-</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 text-center">
        <span class="text-xs font-medium text-slate-400 uppercase">Daily Average / Walker</span>
        <div id="statAvgSteps" class="text-2xl font-bold text-emerald-600 mt-1">-</div>
      </div>
    </div>

    <!-- Podium (Top 3) -->
    <div id="podiumContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 hidden"></div>

    <!-- Leaderboard Table -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h2 class="text-base font-bold text-slate-900">Full Standings</h2>
        <span id="lastUpdated" class="text-xs text-slate-400"></span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold">
              <th class="py-3 px-6">Rank</th>
              <th class="py-3 px-6">Participant</th>
              <th class="py-3 px-6 text-right">Total Steps</th>
              <th class="py-3 px-6 w-1/3">Progress</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="4" class="text-center py-8 text-slate-400">Loading leaderboard data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let participants = [];

    // Auto-fetch report.csv on page load with cache-busting
    window.addEventListener('DOMContentLoaded', () => {
      fetch(`report.csv?t=${Date.now()}`)
        .then(response => {
          if (!response.ok) throw new Error('report.csv not found');
          return response.text();
        })
        .then(csvText => parseAndRender(csvText, 'report.csv'))
        .catch(() => {
          document.getElementById('fileNameDisplay').textContent = 'No default report.csv found. Please upload one.';
          document.getElementById('leaderboardBody').innerHTML = `
            <tr><td colspan="4" class="text-center py-8 text-slate-400">
              Upload a StepUp CSV file using the button above to view rankings.
            </td></tr>`;
        });
    });

    // Manual upload handling
    document.getElementById('csvFileInput').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('fileNameDisplay').textContent = file.name;
      const reader = new FileReader();
      reader.onload = (event) => parseAndRender(event.target.result, file.name);
      reader.readAsText(file);
    });

    // Search filter
    document.getElementById('searchInput').addEventListener('input', function (e) {
      const term = e.target.value.toLowerCase().trim();
      const filtered = participants.filter(p => p.name.toLowerCase().includes(term));
      renderTable(filtered);
    });

    function parseAndRender(csvData, sourceName) {
      Papa.parse(csvData, {
        header: true,
        skipEmptyLines: true,
        complete: function (results) {
          processData(results.data);
          document.getElementById('lastUpdated').textContent = `Loaded from ${sourceName}`;
        }
      });
    }

    function processData(rows) {
      const stepMap = {};

      rows.forEach(row => {
        // Clean keys
        const cleanRow = {};
        Object.keys(row).forEach(k => {
          cleanRow[k.trim()] = row[k];
        });

        // Find keys
        const fNameKey = Object.keys(cleanRow).find(k => /first.*name/i.test(k));
        const lNameKey = Object.keys(cleanRow).find(k => /last.*name/i.test(k));
        const stepsKey = Object.keys(cleanRow).find(k => /total.*step|step/i.test(k));

        let fullName = '';
        if (fNameKey && lNameKey) {
          fullName = `${(cleanRow[fNameKey] || '').trim()} ${(cleanRow[lNameKey] || '').trim()}`.trim();
        } else if (fNameKey) {
          fullName = (cleanRow[fNameKey] || '').trim();
        }

        const rawSteps = stepsKey ? String(cleanRow[stepsKey]).replace(/,/g, '').trim() : '0';
        const steps = parseInt(rawSteps, 10) || 0;

        if (fullName) {
          stepMap[fullName] = (stepMap[fullName] || 0) + steps;
        }
      });

      // Sort descending
      participants = Object.keys(stepMap).map(name => ({
        name: name,
        steps: stepMap[name]
      })).sort((a, b) => b.steps - a.steps);

      renderStats(participants);
      renderPodium(participants);
      renderTable(participants);
    }

    function renderStats(list) {
      const totalSteps = list.reduce((sum, p) => sum + p.steps, 0);
      const avgSteps = list.length ? Math.round(totalSteps / list.length) : 0;

      document.getElementById('statParticipants').textContent = list.length.toLocaleString();
      document.getElementById('statTotalSteps').textContent = totalSteps.toLocaleString();
      document.getElementById('statAvgSteps').textContent = avgSteps.toLocaleString();
    }

    function renderPodium(list) {
      const podium = document.getElementById('podiumContainer');
      if (list.length < 3) {
        podium.classList.add('hidden');
        return;
      }
      podium.classList.remove('hidden');

      const medals = [
        { rank: 1, title: '🥇 1st Place', color: 'border-amber-300 bg-amber-50', text: 'text-amber-800' },
        { rank: 2, title: '🥈 2nd Place', color: 'border-slate-300 bg-slate-100', text: 'text-slate-700' },
        { rank: 3, title: '🥉 3rd Place', color: 'border-orange-300 bg-orange-50', text: 'text-orange-800' }
      ];

      // Reorder indexes visually to: 2nd, 1st, 3rd
      const displayOrder = list.length >= 3 ? [1, 0, 2] : [0, 1, 2].slice(0, list.length);

      podium.innerHTML = displayOrder.map(idx => {
        const item = list[idx];
        if (!item) return '';
        const m = medals[idx];
        return `
          <div class="rounded-xl border ${m.color} p-4 text-center shadow-xs">
            <span class="text-xs font-bold uppercase tracking-wider ${m.text}">${m.title}</span>
            <div class="text-lg font-bold text-slate-800 mt-1 truncate">${item.name}</div>
            <div class="text-xl font-extrabold text-indigo-600 mt-1">${item.steps.toLocaleString()} <span class="text-xs font-medium text-slate-400">steps</span></div>
          </div>
        `;
      }).join('');
    }

    function renderTable(list) {
      const tbody = document.getElementById('leaderboardBody');
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-400">No participants found.</td></tr>`;
        return;
      }

      const maxSteps = participants[0]?.steps || 1;

      tbody.innerHTML = list.map((p, idx) => {
        const rank = idx + 1;
        const pct = Math.min(100, Math.round((p.steps / maxSteps) * 100));
        let rankBadge = `<span class="font-bold text-slate-600">#${rank}</span>`;
        if (rank === 1) rankBadge = `<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded font-bold">🥇 1</span>`;
        else if (rank === 2) rankBadge = `<span class="px-2 py-0.5 bg-slate-200 text-slate-700 rounded font-bold">🥈 2</span>`;
        else if (rank === 3) rankBadge = `<span class="px-2 py-0.5 bg-orange-100 text-orange-800 rounded font-bold">🥉 3</span>`;

        return `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="py-3 px-6">${rankBadge}</td>
            <td class="py-3 px-6 font-semibold text-slate-800">${p.name}</td>
            <td class="py-3 px-6 text-right font-bold text-indigo-600">${p.steps.toLocaleString()}</td>
            <td class="py-3 px-6">
              <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                <div class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: ${pct}%"></div>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }
  </script>
</body>

</html>
