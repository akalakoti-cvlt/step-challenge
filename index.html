<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Step Challenge Leaderboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-8">

    <!-- Header -->
    <header class="text-center mb-8">
      <span
        class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-semibold rounded-full uppercase tracking-wider mb-2">StepUp
        Challenge</span>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">Corporate Step Leaderboard</h1>
      <p class="text-slate-500 mt-2 text-sm sm:text-base">Rankings updated daily. Keep stepping towards the top!</p>
    </header>

    <!-- 1st Place Spotlight Card -->
    <div id="firstPlaceCard"
      class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-2xl p-6 mb-8 shadow-xs hidden">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
        <div>
          <span
            class="text-xs font-bold text-amber-800 uppercase tracking-widest bg-amber-200/60 px-2.5 py-1 rounded-md">Tournament
            Leader &bull; 1st Place</span>
          <h2 id="leaderName" class="text-2xl font-black text-slate-900 mt-2">-</h2>
        </div>
        <div class="text-center sm:text-right">
          <span class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Steps</span>
          <div id="leaderSteps" class="text-3xl font-black text-amber-600 mt-0.5">-</div>
        </div>
      </div>
    </div>

    <!-- Summary Metrics -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="bg-white rounded-xl shadow-xs border border-slate-200 p-4 text-center">
        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Participants</span>
        <div id="statParticipants" class="text-2xl font-bold text-slate-800 mt-1">-</div>
      </div>
      <div class="bg-white rounded-xl shadow-xs border border-slate-200 p-4 text-center">
        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Steps Walked</span>
        <div id="statTotalSteps" class="text-2xl font-bold text-indigo-600 mt-1">-</div>
      </div>
      <div class="bg-white rounded-xl shadow-xs border border-slate-200 p-4 text-center">
        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Daily Average / Walker</span>
        <div id="statAvgSteps" class="text-2xl font-bold text-emerald-600 mt-1">-</div>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="bg-white rounded-xl shadow-xs border border-slate-200 p-3 mb-6">
      <input id="searchInput" type="text" placeholder="Search participant by name..."
        class="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    </div>

    <!-- Leaderboard Table -->
    <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h2 class="text-base font-bold text-slate-900">Standings</h2>
        <span id="lastUpdated" class="text-xs text-slate-400">Loading data...</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold">
              <th class="py-3 px-6 w-24">Rank</th>
              <th class="py-3 px-6">Participant</th>
              <th class="py-3 px-6 text-right">Total Steps</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="3" class="text-center py-8 text-slate-400">Fetching latest report.csv...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let participants = [];

    // Automatically fetch report.csv with cache-busting timestamp
    window.addEventListener('DOMContentLoaded', () => {
      fetch(`report.csv?t=${Date.now()}`)
        .then(response => {
          if (!response.ok) throw new Error('report.csv could not be found');
          return response.text();
        })
        .then(csvText => {
          Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true,
            complete: function (results) {
              processData(results.data);
              document.getElementById('lastUpdated').textContent = '';
            }
          });
        })
        .catch(() => {
          document.getElementById('lastUpdated').textContent = 'Error loading file';
          document.getElementById('leaderboardBody').innerHTML = `
            <tr><td colspan="3" class="text-center py-8 text-slate-400">
              Could not load <code>report.csv</code>. Ensure it is committed in the same folder as <code>index.html</code>.
            </td></tr>`;
        });
    });

    // Real-time search filter
    document.getElementById('searchInput').addEventListener('input', function (e) {
      const term = e.target.value.toLowerCase().trim();
      const filtered = participants.filter(p => p.name.toLowerCase().includes(term));
      renderTable(filtered);
    });

    function processData(rows) {
      const stepMap = {};

      rows.forEach(row => {
        const cleanRow = {};
        Object.keys(row).forEach(k => {
          cleanRow[k.trim()] = row[k] ? String(row[k]).trim() : '';
        });

        const firstName = cleanRow['First Name'] || '';
        const lastName = cleanRow['Last Name'] || '';
        const fullName = `${firstName} ${lastName}`.trim();

        const rawSteps = cleanRow['Total Steps'] || '0';
        const steps = parseInt(rawSteps.replace(/,/g, ''), 10) || 0;

        if (fullName) {
          stepMap[fullName] = (stepMap[fullName] || 0) + steps;
        }
      });

      // 1. Convert to array and sort strictly descending by steps
      const sortedList = Object.keys(stepMap).map(name => ({
        name: name,
        steps: stepMap[name]
      })).sort((a, b) => b.steps - a.steps);

      // 2. Assign absolute leaderboard rank before any searching/filtering occurs
      participants = sortedList.map((p, idx) => ({
        ...p,
        rank: idx + 1
      }));

      renderStats(participants);
      renderLeaderCard(participants);
      renderTable(participants);
    }

    function renderStats(list) {
      const totalSteps = list.reduce((sum, p) => sum + p.steps, 0);
      const avgSteps = list.length ? Math.round(totalSteps / list.length) : 0;

      document.getElementById('statParticipants').textContent = list.length.toLocaleString();
      document.getElementById('statTotalSteps').textContent = totalSteps.toLocaleString();
      document.getElementById('statAvgSteps').textContent = avgSteps.toLocaleString();
    }

    function renderLeaderCard(list) {
      const card = document.getElementById('firstPlaceCard');
      if (!list.length) {
        card.classList.add('hidden');
        return;
      }
      const leader = list[0];
      document.getElementById('leaderName').textContent = leader.name;
      document.getElementById('leaderSteps').textContent = leader.steps.toLocaleString();
      card.classList.remove('hidden');
    }

    function renderTable(list) {
      const tbody = document.getElementById('leaderboardBody');
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-center py-8 text-slate-400">No participants found.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map((p) => {
        return `
          <tr class="hover:bg-slate-50 transition-colors">
            <!-- Retains the permanent leaderboard rank during searches -->
            <td class="py-3 px-6 font-semibold text-slate-500">#${p.rank}</td>
            <td class="py-3 px-6 font-semibold text-slate-900">${p.name}</td>
            <td class="py-3 px-6 text-right font-bold text-indigo-600">${p.steps.toLocaleString()}</td>
          </tr>
        `;
      }).join('');
    }
  </script>
</body>

</html>
